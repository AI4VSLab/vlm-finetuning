[project]
name = "vlm-finetuning"
description = "VLM finetuning for AMD diagnosis"
version = "0.1.0"
authors = [{ name = "AI4VS Lab" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "torch~=2.7",
    "hydra-core~=1.3",
    "tqdm~=4.67",
    "torchvision~=0.22",
    "tfrecord~=1.14",
    "pillow~=11.3",
    "numpy~=2.3",
    "transformers~=4.54",
    "datasets~=4.0",
    "accelerate~=1.10",
    "evaluate~=0.4",
    "bitsandbytes~=0.46",
    "trl~=0.21",
    "peft~=0.17",
    "pillow~=11.3",
    "protobuf",
    "sentencepiece",
]

[dependency-groups]
dev = ["ruff~=0.12"]
