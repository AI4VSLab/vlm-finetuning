[project]
name = "vlm-finetuning"
description = "VLM finetuning for AMD diagnosis"
version = "0.1.0"
authors = [{ name = "AI4VS Lab" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = "~=3.10"
dependencies = [
    "hydra-core~=1.3",
    "tqdm~=4.67",
    "tfrecord~=1.14",
    "pillow~=11.3",
    "evaluate",
    "rouge_score",
    "nltk",
    "wandb",
    "bert_score",
    "pandas",
    "accelerate==0.21.0",
    "bitsandbytes==0.43.1",
    "huggingface-hub==0.29.3",
    "numpy==1.26.4",
    "pytorch-lightning==1.9.5",
    "scipy==1.13.0",
    "timm==1.0.15",
    "torch==2.1.2",
    "torchmetrics==1.6.2",
    "torchvision==0.16.2",
    "transformers==4.39.3",
    "pyarrow==14.0.0",
    "datasets==2.14.6",
]

[dependency-groups]
dev = ["ruff~=0.12"]
