[project]
name = "vlm-finetuning"
description = "VLM finetuning for AMD diagnosis"
version = "0.1.0"
authors = [{ name = "AI4VS Lab" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "torch~=2.7",
    "hydra-core~=1.3",
    "tqdm~=4.67",
    "torchvision~=0.22",
    "tfrecord~=1.14",
    "pillow~=11.3",
    "numpy~=2.3",
    "transformers~=4.54",
    "datasets==3.3.2",
    "accelerate==1.4.0",
    "evaluate==0.4.3",
    "bitsandbytes==0.45.3",
    "trl==0.15.2",
    "peft==0.14.0",
    "pillow",
    "protobuf",
    "sentencepiece",
]

[dependency-groups]
dev = ["ruff~=0.12"]
