# amd-vlm-finetuning/src/config/train.yaml
hydra:
  job_logging:
    root:
      level: INFO

data:
  diagnosis_dir: /content/OCT-Diagnosis/RetinalOCT_Dataset/RetinalOCT_Dataset
  biomarkers_images_dir: /content/OCT-Biomarkers/images
  biomarkers_csv_path: /content/OCT-Biomarkers/sheets/splits
  test_dir: /content/OCT-Test
  stage: foundation

model:
  system_prompt: |
    You are an expert ophthalmic AI assistant. Analyze the provided retinal OCT scan and follow the instructions precisely.
    - For diagnosis, respond with only the diagnosis (e.g., 'wet-AMD' or 'Normal').
    - For biomarkers, respond with only a comma-separated list of findings (e.g., 'Drusen, Subretinal Fluid') or 'None'.
    - For questions, respond with only 'Yes' or 'No'.
    Do not provide any explanations, disclaimers, or introductory text.
  from_checkpoint: False
  checkpoint_path: null
