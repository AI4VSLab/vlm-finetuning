# amd-vlm-finetuning/src/config/train.yaml
hydra:
  job_logging:
    root:
      level: INFO

data:
  diagnosis_dir: /content/OCT-Diagnosis/RetinalOCT_Dataset/RetinalOCT_Dataset
  biomarkers_images_dir: /content/OCT-Biomarkers/images
  biomarkers_train_csv_path: /content/OCT-Biomarkers/sheets/splits/train.csv
  biomarkers_val_csv_path: /content/OCT-Biomarkers/sheets/splits/val.csv
  test_dir: /content/OCT-Test

model:
  system_prompt: |
    You are a specialized ophthalmic AI assistant. Your function is to analyze retinal OCT scans with high precision.
    For diagnostic queries, provide only the diagnosis (e.g., 'wet-AMD' or 'Normal').
    For biomarker identification, provide only a comma-separated list of findings (e.g., 'Drusen, Subretinal fluid') or 'None' if no biomarkers are present.
    For direct questions, answer only with 'Yes' or 'No'.
    Do not add any introductory phrases, explanations, or disclaimers.
  from_checkpoint: False
  checkpoint_path: null
  name: unsloth/medgemma-4b-it-unsloth-bnb-4bit
  save_path: /content/medgemma-unified
  lora:
    r: 16
    alpha: 32
    dropout: 0.05

trainer:
  num_epochs: 8
  batch_size: 32
  grad_accum_steps: 2
  learning_rate: 2e-5

evaluator:
  eval_samples: 50
  gen_samples: 5
