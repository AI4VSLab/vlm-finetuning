hydra:
  job_logging:
    root:
      level: INFO

data:
  train_path: /content/RetinalOCT_Dataset/RetinalOCT_Dataset

model:
  from_checkpoint: False
  name: unsloth/medgemma-4b-it
  path: /content/models/unsloth/medgemma-4b-it-finetuned

trainer:
  max_steps: 500
  # num_epochs: 20
  batch_size: 8
  grad_accum_steps: 1
  learning_rate: 1e-5
  logging_steps: 5

evaluator:
  eval_samples: 50
  gen_samples: 5
