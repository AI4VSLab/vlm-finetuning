hydra:
  job_logging:
    root:
      level: INFO

data:
  path: /content/RetinalOCT_Dataset/RetinalOCT_Dataset
  prompt: ${model.prompt}

model:
  prompt: "Analyze this retinal OCT scan and provide a diagnosis and a list of key biomarkers in JSON format."
  from_checkpoint: False
  name: unsloth/medgemma-4b-it
  path: /content/${model.name}-pretrained
  lora:
    r: 16 # The larger, the higher the accuracy, but might overfit
    alpha: 16 # Recommended alpha == r at least
    dropout: 0.05

trainer:
  num_epochs: 1
  batch_size: 16
  grad_accum_steps: 1
  learning_rate: 1e-4
  logging_steps: 5

evaluator:
  eval_samples: 50
  gen_samples: 5
