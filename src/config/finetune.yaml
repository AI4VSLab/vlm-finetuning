hydra:
  job_logging:
    root:
      level: INFO

data:
  train_path: /content/OCT_Transcript.tfrecord # [/content/OCT_Transcript.tfrecord, /content/RetinalOCT_Dataset]
  test_path: /content/OCT_Test

model:
  system_prompt: You are an expert ophthalmic diagnostic assistant. Your sole purpose is to analyze retinal OCT scans and return your findings in a strict JSON format.
  user_prompt: |
    Analyze this retinal OCT scan. Respond ONLY with a valid JSON object that adheres to the following schema. Do not include any other text or explanations.

    Example Format:
    {
      "diagnosis": "string",
      "biomarkers": [
        "string"
      ]
    }
  from_checkpoint: False
  name: unsloth/medgemma-4b-it-unsloth-bnb-4bit
  path: /content/models/unsloth/medgemma-4b-it-stage3-finetuned
  lora:
    r: 8 # The larger, the higher the accuracy, but might overfit
    alpha: 16 # Recommended alpha == r at least
    dropout: 0.05

trainer:
  num_epochs: 5
  batch_size: 8
  grad_accum_steps: 1
  learning_rate: 1e-5

evaluator:
  eval_samples: 50
  gen_samples: 5
