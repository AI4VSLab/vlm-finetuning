hydra:
  job_logging:
    root:
      level: INFO

data:
  train_path: /content/OCT_Transcript.tfrecord # [/content/OCT_Transcript.tfrecord, /content/RetinalOCT_Dataset]
  test_path: /content/OCT_Test
  prompt: ${model.prompt}

model:
  prompt: Analyze this retinal OCT scan and provide a diagnosis and a list of key biomarkers in JSON format.
  from_checkpoint: False
  name: unsloth/medgemma-4b-it
  path: /content/models/unsloth/medgemma-4b-it-finetuned
  lora:
    r: 8 # The larger, the higher the accuracy, but might overfit
    alpha: 8 # Recommended alpha == r at least
    dropout: 0.0

trainer:
  num_epochs: 20
  batch_size: 8
  grad_accum_steps: 1
  learning_rate: 1e-5
  logging_steps: 5

evaluator:
  eval_samples: 50
  gen_samples: 5
