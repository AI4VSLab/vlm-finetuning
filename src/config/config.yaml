hydra:
  job_logging:
    root:
      level: INFO

system:
  device: cuda

data:
  train_path: /content/VQA.tfrecord
  test_path: /content/OCT_test_dataset

model:
  model_name: unsloth/gemma-3-4b-pt
  chat_template: gemma-3
  prompt: You are a highly skilled AI assistant specializing in ophthalmic diagnostics. Your task is to analyze Optical Coherence Tomography (OCT) images to determine the presence of Age-related Macular Degeneration (AMD) or if the image appears normal. Provide a concise explanation of your findings.

trainer:
  num_epochs: 10
  batch_size: 8
  grad_accum_steps: 1

evaluator:
  num_samples: 50
