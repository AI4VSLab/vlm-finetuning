hydra:
  job_logging:
    root:
      level: INFO

data:
  train_path: /content/BulletPoint.tfrecord
  test_path: /content/OCT_test_dataset

model:
  from_checkpoint: False
  name: unsloth/medgemma-4b-it
  path: /content/models/unsloth/medgemma-4b-it-finetuned
  prompt: You are an expert ophthalmologist (retina specialist) and medical AI researcher. Extract a consist list of possible clinically relavant image features from OCT eye scans. Each feature should be separated by semicolon.

trainer:
  num_epochs: 20
  batch_size: 4
  grad_accum_steps: 1
  learning_rate: 1e-5
  logging_steps: 5

evaluator:
  num_samples: 20
