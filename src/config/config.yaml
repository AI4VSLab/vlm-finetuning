hydra:
  job_logging:
    root:
      level: INFO

data:
  train_path: /content/VQA.tfrecord
  test_path: /content/OCT_test_dataset

model:
  from_checkpoint: False
  name: unsloth/medgemma-4b-it
  path: /content/models/unsloth/medgemma-4b-it-finetuned
  prompt: |
    You are a highly skilled AI assistant specializing in ophthalmic diagnostics. Your task is to analyze Optical Coherence Tomography (OCT) images to determine the presence of Age-related Macular Degeneration (AMD) or if the image appears normal. Provide a concise explanation of your findings and a definitive diagnosis.
    Your output must strictly follow this format:
    <explanation>[Your detailed but concise reasoning based on OCT findings]</explanation> <diagnosis>[AMD or Normal]</diagnosis>

trainer:
  num_epochs: 20
  batch_size: 4
  grad_accum_steps: 1
  learning_rate: 1e-5
  logging_steps: 5

evaluator:
  num_samples: 50
