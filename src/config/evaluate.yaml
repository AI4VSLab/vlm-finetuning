hydra:
  job_logging:
    root:
      level: INFO

data:
  train_path: /content/OCT_Transcript.tfrecord # [/content/OCT_Transcript.tfrecord, /content/RetinalOCT_Dataset]
  test_path: /content/OCT_Test
  prompt: ${model.prompt}

model:
  prompt: Analyze this retinal OCT scan and provide a diagnosis and a list of key biomarkers in JSON format.
  from_checkpoint: False
  name: unsloth/medgemma-4b-it-unsloth-bnb-4bit
  path: /content/${model.name}-pretrained
  lora:
    r: 16 # The larger, the higher the accuracy, but might overfit
    alpha: 16 # Recommended alpha == r at least
    dropout: 0.05

evaluator:
  eval_samples: 50
  gen_samples: 5
